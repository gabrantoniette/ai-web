<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AI Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>🤖 Web AI Demo</h1>

        <form id="question-form">
            <div class="parameters">
                <div class="param-group">
                    <label for="temperature">Temperature: <span id="temp-value" class="value-display"></span></label>
                    <input type="range" id="temperature" name="temperature" step="0.1">
                    <div class="param-description">Controls how creative the answers are. Lower values = more focused,
                        higher values = more creative</div>
                </div>

                <div class="param-group">
                    <label for="topK">Top K: <span id="topk-value" class="value-display"></span></label>
                    <input type="number" id="topK" name="topK">
                    <div class="param-description">Limits sampling to the K most likely tokens. Lower values = more
                        predictable</div>
                </div>
            </div>

            <div class="file-input-group">
                <label>📎 Attach a file (image or English audio):</label>
                <div class="file-input-wrapper">
                    <input type="file" id="file-input" accept="image/*,audio/*" hidden>
                    <button type="button" class="file-upload-btn" id="file-upload-btn">
                        <span class="upload-icon">📁</span>
                        <span class="upload-text">Choose file</span>
                    </button>
                    <span class="file-selected-name" id="file-selected-name"></span>
                </div>
                <div class="file-preview" id="file-preview"></div>
            </div>

            <label for="question">Chat with the AI:</label>
            <textarea name="question" id="question" placeholder="Type your question here..."></textarea>

            <button type="submit" id="ask-button">Send</button>
        </form>

        <div id="output"></div>

        <footer class="copyright">
            Gabriel Antoniette - AI Web - UNIPDS - <span id="year"></span>
        </footer>
    </div>

    <script type="module" src="./index.js"></script>
</body>

</html>
