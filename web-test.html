<!doctype html>
<html lang="en">
<body>
  <button id="setupButton">Check / download model</button>
  <pre id="log"></pre>

  <script>
    const log = (...a) => {
      console.log(...a);
      document.getElementById('log').textContent +=
        a.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(' ') + '\n';
    };

    async function getAvailability() {
      if ('LanguageModel' in self) {
        return { api: 'LanguageModel (new)', status: await LanguageModel.availability() };
      }
      if (self.ai?.languageModel) {
        const c = await ai.languageModel.capabilities();
        return { api: 'ai.languageModel (legacy)', status: c.available };
      }
      return { api: 'none', status: 'unavailable' };
    }

    async function createSession() {
      if ('LanguageModel' in self) {
        return LanguageModel.create({
          monitor(m) {
            m.addEventListener('downloadprogress', e =>
              log(`Downloading: ${Math.round(e.loaded * 100)}%`));
          }
        });
      }
      return ai.languageModel.create();
    }

    // Automatic check on load
    getAvailability().then(r => log('Availability:', r));

    // Create the session only after a click (avoids NotAllowedError)
    document.getElementById('setupButton').onclick = async () => {
      try {
        const session = await createSession();
        log('Session created successfully');
        const answer = await session.prompt('Say hello in one sentence.');
        log('Answer:', answer);
      } catch (e) {
        log('Error:', e.name, e.message);
      }
    };
  </script>
</body>
</html>
